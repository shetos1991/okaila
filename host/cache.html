<html manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<title></title>
<style>
body{margin:0;background:#05070c url("../youssef-background.jpg") center center / contain fixed no-repeat;color:#0f172a;font:16px/1.45 system-ui,sans-serif;text-align:center}
.info{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#1d4ed8}
</style>
<script>
history.replaceState(null, null, 'jb.html');
function pct(e){
  var m=document.getElementById('msgs');
  if(!m)return;
  var p=e.total?Math.round(e.loaded/e.total*100):0;
  m.textContent=p? (p+'%') : '';
}
function go(){
  setTimeout(function(){ location.replace('jb.html'); }, 700);
}
if(window.applicationCache){
  applicationCache.addEventListener('progress', pct, false);
  applicationCache.oncached = go;
  applicationCache.onupdateready = function(){ try{applicationCache.swapCache();}catch(e){} go(); };
  applicationCache.addEventListener('noupdate', function(){ setTimeout(function(){ location.replace('jb.html'); }, 200); }, false);
  applicationCache.addEventListener('error', function(){
    var m=document.getElementById('msgs');
    if(m) m.textContent='Cache failed';
  }, false);
} else {
  setTimeout(function(){ location.replace('jb.html'); }, 300);
}
</script>
</head>
<body><div id="msgs" class="info"></div></body>
</html>
